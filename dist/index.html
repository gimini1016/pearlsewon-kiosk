ation_당을 줄이는 중", "type": "situation"}}, {"page_content": "[상황] 우유를 피해야 할 때\n우유가 안 들어간 메뉴예요. 밀크폼·치즈폼에도 우유가 들어 있어요. 같은 도구로 만들어서 아주 적은 양이 섞일 수 있어요.\n어울리는 메뉴: 아메리카노, 얼그레이티, 자몽 자스민티, 패션후르츠 히비스커스, 청포도 스무디", "metadata": {"id": "situation_우유를 피해야 할 때", "type": "situation"}}, {"page_content": "[상황] 처음 왔을 때\n처음이라면 많이 찾는 베스트·시그니처 메뉴가 무난해요.\n어울리는 메뉴: 얼그레이 슈페너, 블랙 밀크티 + 펄, 흑당 밀크티 + 펄, 망고 요구르트 + 화이트펄", "metadata": {"id": "situation_처음 왔을 때", "type": "situation"}}, {"page_content": "[매장 정책] 잘못 나온 메뉴\n메뉴가 잘못 나왔으면 주문 번호를 알려 주세요. 바로 다시 만들어 드려요. 키오스크에서 ‘직원 불러 주세요’라고 해도 돼요.", "metadata": {"id": "policy_잘못 나온 메뉴", "type": "policy", "source": "가상 정책(팀 결정)"}}, {"page_content": "[매장 정책] 주문 취소\n음료를 만들기 전이면 키오스크에서 바로 취소돼요. 만들기 시작한 뒤에는 직원에게 말씀해 주세요.", "metadata": {"id": "policy_주문 취소", "type": "policy", "source": "가상 정책(팀 결정)"}}, {"page_content": "[매장 정책] 환불\n결제한 수단으로 그대로 환불돼요. 카드 취소는 카드사에 따라 3~5영업일 걸릴 수 있어요.", "metadata": {"id": "policy_환불", "type": "policy", "source": "가상 정책(팀 결정)"}}, {"page_content": "[매장 정책] 쿠폰\n쿠폰은 한 번 주문에 한 장만 쓸 수 있고, 다른 할인과 함께 쓸 수 없어요.", "metadata": {"id": "policy_쿠폰", "type": "policy", "source": "가상 정책(팀 결정)"}}, {"page_content": "[매장 정책] 적립\n음료 한 잔에 스탬프 하나가 쌓여요. 10개를 모으면 음료 한 잔(중 사이즈)을 드려요. 디저트는 적립되지 않아요.", "metadata": {"id": "policy_적립", "type": "policy", "source": "가상 정책(팀 결정)"}}, {"page_content": "[매장 정책] 포장\n포장은 실링 또는 뚜껑으로 드려요. 2잔 이상이면 캐리어에 담아 드려요.", "metadata": {"id": "policy_포장", "type": "policy", "source": "가상 정책(팀 결정)"}}, {"page_content": "[매장 정책] 매장 이용\n매장에서 드시면 다회용 컵으로 드려요. 콘센트 자리는 창가 1인석과 2인 테이블에 있어요.", "metadata": {"id": "policy_매장 이용", "type": "policy", "source": "가상 정책(팀 결정)"}}, {"page_content": "[매장 정책] 직원 호출\n키오스크로 해결이 어려우면 ‘직원 불러 주세요’라고 말씀해 주세요. 직원이 바로 와요.", "metadata": {"id": "policy_직원 호출", "type": "policy", "source": "가상 정책(팀 결정)"}}]};

 let masked=text;for(const top of [...D.toppings].sort((a,b)=>b.name.length-a.name.length)){const re=new RegExp(top.name+'(?:을|은|도)?\\s*(빼|제거|없이|추가|넣|올려)');const match=masked.match(re);if(!match)continue;masked=masked.replace(re,'');if(!O.toppings.categories.includes(i.category)){msgs.push(rule('topping_scope'));continue;}if(/빼|제거|없이/.test(match[1]))c.tops=c.tops.filter(t=>t!==top.name);else if(!c.tops.includes(top.name)){if(c.tops.length>=O.toppings.max_per_drink)msgs.push(rule('topping_max'));else c.tops.push(top.name);}}
 const xforms=[[/샷(?:을)?\s*(추가|빼|제거)|샷\s*[12](?:회|개)/,'shot'],[/디카페인/,'decaf'],[/오트밀크|오트/,'oat_milk'],[/바닐라\s*시럽/,'syrup_vanilla'],[/헤이즐넛\s*시럽/,'syrup_hazelnut'],[/카라멜\s*시럽/,'syrup_caramel']];for(const [re,id]of xforms){if(!re.test(text))continue;const e=extra(id),allowed=e.categories.includes(i.category)&&(!e.requires_allergen||i.allergens.includes(e.requires_allergen));if(!allowed){msgs.push(e.name+' 옵션은 이 메뉴에 적용할 수 없어요.');continue;}if(id==='shot')c.shot=/샷.*(빼|제거)/.test(text)?0:/샷\s*2|두\s*샷/.test(text)?2:1;else if(id==='decaf')c.decaf=!/디카페인.*(취소|빼|제거)/.test(text);else if(id==='oat_milk')c.oat=!/오트.*(취소|빼|제거)/.test(text);else c.syrup=/시럽.*(빼|제거|없이)/.test(text)?null:id;}
 if(/우유로\s*(변경|바꿔)/.test(text))c.oat=false;if(/뚜껑/.test(text)&&c.seal)c.seal='뚜껑';if(/실링/.test(text)&&c.seal)c.seal='실링';
}
const OPTION_REQUEST=/사이즈|얼음|당도|덜\s*달|안\s*달|따뜻|차갑|아이스|\bHOT\b|\bICE\b|샷|오트|시럽|디카페인|뚜껑|실링|(?:펄|폼|코코넛|알로에)(?:을|은|도)?\s*(추가|넣|빼|제거|없이)/i;
function cfgSummary(i,c){return [i.name,c.size,c.temp,c.sugar!==null?'당도 '+c.sugar+'%':null,c.ice?'얼음 '+c.ice:null,...c.tops,c.syrup?extra(c.syrup).name:null,c.oat?'오트밀크':null,c.shot?'샷 '+c.shot+'회':null,c.decaf?'디카페인':null].filter(Boolean).join(' · ');}
function rulesHear(text){const t=text.trim();if(!t)return;appendMessage('user',t);try{handleMessage(t);}catch(error){console.error(error);say('처리하지 못했어요. 다시 말씀하시거나 직원을 불러 주세요.');}appendMessage('bot',[$('#m').textContent,...Array.from($('#notes').children).map(e=>e.textContent)].filter(Boolean).join('\n'));$('#conversation').open=true;renderMessages();}
function handleMessage(t){
 if(/직원/.test(t))return staff();
 if(S.paid){say('결제된 주문은 여기서 변경할 수 없어요. 도움이 필요하면 직원을 불러 주세요.');return;}
 if(/뒤로|이전\s*화면/.test(t)){goBack();return;}
 if(/빈자리|자리\s*있|좌석/.test(t)){say(`현재 빈자리는 ${D.seats}석이에요. 창가와 콘센트 자리는 직원에게 확인해 주세요.`);return;}
 if(/대기|몇\s*분|얼마나\s*걸/.test(t)){say(`앞에 음료 ${D.store.queue_drinks}잔이 있고, 예상 대기는 ${D.wait}분부터예요.`);return;}
 if(/뭐예요|뭐에요|뭔가요|뭐야|차이|설명/.test(t)){const tp=[...D.toppings].sort((a,b)=>b.name.length-a.name.length).find(x=>t.includes(x.name));if(tp){say(tp.description);return;}const f=FAQ_RE.find(([re])=>re.test(t));if(f){say(D.faq[f[1]].replace(/^\[자주 묻는 말\]\s*/, '').replace(/^[^?]*\?\s*/,''));return;}const match=findMenus(t)[0];if(match){say(byId[match.id].description);return;}}
 const policy=POL_RE.find(([re])=>re.test(t));if(policy){say(D.policy[policy[1]]);if(/취소|잘못/.test(t))B.append(btn('ghost','직원 부르기',staff));return;}
 if(/전체|메뉴판|다\s*보여/.test(t)){S.stage='full';show();return;}
 if(/장바구니/.test(t)){S.stage='cart';show();return;}
 if(S.stage==='where'&&!findMenus(t).length){if(/포장|가져|테이크/.test(t)){S.where='포장';S.stage='fork';show();return;}if(/매장|먹고|여기서/.test(t)){S.where='매장';S.stage='fork';show();return;}}
 if(S.stage==='fork'&&/^(아직|모르|골라)/.test(t)){S.stage='taste';show();return;}
 if(S.stage==='cup'&&/^(네|응|좋아|이대로|담아)([\s!?.]|$)/.test(t)){addLine(S.item,S.cfg,1);return;}
 if(S.stage==='cart'&&/결제/.test(t)){if(!S.cart.length){say('먼저 메뉴를 담아 주세요.');return;}S.stage='pay';show();return;}
 if(S.stage==='pay'&&/카드|QR|큐알|쿠폰/i.test(t)){finishPayment(/카드/.test(t)?'카드':/쿠폰/.test(t)?'쿠폰':'QR');return;}
 if(S.stage==='picks'&&/다른\s*(거|걸|것)|별로|다시\s*추천/.test(t)){if(S.rerolls<2&&S.pool.length>(S.page+1)*3){S.rerolls++;S.page++;show();}else{S.stage='full';show();say('더 추천할 메뉴가 없어 전체 메뉴를 보여 드려요.');}return;}
 const found=findMenus(t);
 if(S.stage==='cup'&&OPTION_REQUEST.test(t)&&(!found.length||!found.some(m=>m.id!==S.item.id))){const before=clone(S.cfg),msgs=[];applyText(S.item,S.cfg,t,msgs);show();if(JSON.stringify(before)!==JSON.stringify(S.cfg))say('변경했어요. '+cfgSummary(S.item,S.cfg),msgs);else say(msgs.length?'요청하신 옵션을 확인해 주세요.':'어떤 옵션으로 바꿀까요? 사이즈, 당도, 얼음이나 재료를 알려 주세요.',msgs);return;}
 if(!found.length){const situ=Object.keys(SITU).find(k=>SITU[k].re.test(t));const less=LESS_RE.test(t);const taste=Object.keys(TASTE_RE).find(k=>TASTE_RE[k].test(t)&&!(less&&k==='달달'))||(/순하게|순한/.test(t)?'부드러운':/달게/.test(t)&&!less?'달달':null);if(situ||taste||less){if(!S.where)S.where='포장';S.situ=situ||null;S.cat=situ?null:taste;S.less=less;goPicks();return;}}
 if(found.length){const {lines,unknown}=readOrder(t);const warnings=unknown.map(unknownText);if(!S.where)S.where='포장';if(/있어요|있나요|파나요|가능|되나요/.test(t)&&!/주세요|주문|담아|할게/.test(t)){const names=lines.map(l=>l.i.name+(l.i.sold_out?'는 지금 품절이에요.':' 있어요.'));S.stage='full';show();say(names.join(' ')||'메뉴를 확인해 주세요.',warnings);return;}const available=lines.filter(l=>!l.i.sold_out);lines.filter(l=>l.i.sold_out).forEach(l=>warnings.push(l.i.name+'는 지금 품절이에요.'));if(!available.length){S.stage='full';show();say('해당 메뉴를 주문할 수 없어 전체 메뉴를 보여 드려요.',warnings);return;}if(available.length===1&&available[0].q===1){const i=available[0].i,c=defaultsFor(i);applyText(i,c,available[0].seg,warnings);choose(i,c,'추천 조합을 준비했어요. '+cfgSummary(i,c),warnings);return;}for(const l of available){const c=defaultsFor(l.i);applyText(l.i,c,l.seg,warnings);editIndex=null;addLine(l.i,c,l.q,true);}S.stage='cart';show();say('잔별로 나눠 담았어요. 장바구니를 확인해 주세요.',warnings);return;}
 if(OPTION_REQUEST.test(t)){say('먼저 음료를 골라 주세요. 선택한 음료에서 옵션을 바꿀 수 있어요.');return;}
 say('그건 제가 답하기 어려워요. 직원을 불러 드릴까요?');const r=box('row2');r.append(btn('ghost','네, 불러 주세요',staff),btn('ghost','괜찮아요',show));B.append(r);
}
$('#f').addEventListener('submit',e=>{e.preventDefault();const t=$('#in').value;$('#in').value='';hear(t);});
$('#staff').onclick=staff;$('#reset').onclick=reset;$('#back').onclick=goBack;
$('#theme').onclick=()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';$('#theme').textContent=dark?'☀':'☾';$('#theme').setAttribute('aria-label',dark?'라이트 모드로 전환':'다크 모드로 전환');};
$('#closeDialog').onclick=()=>$('#dialog').close();
TASTE_RE['달달']=/달달|달콤|단\s*거|달게/;TASTE_RE['부드러운']=/부드러|고소|순하게|순한/;
rulesReset();
window.pearlsewon={get state(){return S;},get messages(){return messages;},select:id=>choose(byId[id]),hear,reset,back:goBack,priceOf,drinkSvg,styles:{drinks:DRINK_STYLE,toppings:TOP_STYLE,extras:EXTRA_STYLE}};

let aiMode = 'rules', aiPending = false, aiEpoch = 0, aiAbort = null;
const baseReset = rulesReset;
const aiReady = (async () => {
  if (window.__PEARL_RULES_TEST__ || !/^https?:$/.test(location.protocol)) return;
  aiMode = 'checking';
  try {
    const r = await fetch('/api/health', {cache:'no-store'});
    const data = await r.json();
    aiMode = r.ok && data.configured ? 'live' : 'unavailable';
  } catch { aiMode = 'unavailable'; }
  updateAIStatus();
})();
function updateAIStatus(){const hint=$('.conversation-hint');hint.textContent=aiPending?'답변 준비 중':aiMode==='live'?'AI와 대화':aiMode==='rules'?'시연 대화':'AI 연결 확인 필요';}
function reset(){aiEpoch++;if(aiAbort)aiAbort.abort();aiPending=false;B.inert=false;baseReset();updateAIStatus();}
function hear(text){const t=text.trim();if(!t)return;if(aiMode==='rules')return rulesHear(t);return liveHear(t);}
async function liveHear(text){
  await aiReady;
  if(aiPending)return;
  if(aiMode!=='live'){appendMessage('user',text);say('AI 서버에 연결하지 못했어요. 서버를 실행한 뒤 다시 열어 주세요.');appendMessage('bot',$('#m').textContent);$('#conversation').open=true;return;}
  const epoch=aiEpoch;
  const conversation=messages.slice(-10);
  const state={stage:S.stage,where:S.where,item_id:S.item?.id||null,cfg:S.cfg?clone(S.cfg):null,paid:S.paid};
  appendMessage('user',text);$('#conversation').open=true;aiPending=true;aiAbort=new AbortController();
  const timeout=setTimeout(()=>aiAbort?.abort(),55000);
  B.inert=true;$('#f button').disabled=true;$('#in').disabled=true;$('#back').disabled=true;updateAIStatus();
  try{
    const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,state,conversation}),signal:aiAbort.signal});
    const action=await response.json();
    if(epoch!==aiEpoch)return;
    if(!response.ok)throw new Error(action.error||'AI 응답을 받지 못했어요.');
    applyAIAction(action,text);
    say(action.reply,action.warnings||[]);
    appendMessage('bot',[action.reply,...(action.warnings||[])].join('\n'));
  }catch(error){
    if(epoch!==aiEpoch)return;
    const message=error.name==='AbortError'?'응답이 늦어지고 있어요. 잠시 뒤 다시 시도해 주세요.':error.message;
    say(message);appendMessage('bot',message);$('#in').value=text;
  }finally{
    clearTimeout(timeout);
    if(epoch===aiEpoch){aiPending=false;aiAbort=null;B.inert=false;$('#f button').disabled=false;$('#in').disabled=false;memo();updateAIStatus();renderMessages();}
  }
}
function applyAIAction(action,text){
  if(!S.paid&&['매장','포장'].includes(action.fulfillment))S.where=action.fulfillment;
  if(action.intent==='staff'){staff();return;}
  if(action.intent==='recommend'){
    const pool=(action.recommendations||[]).map(id=>byId[id]).filter(i=>i&&!i.sold_out);
    if(!pool.length)return;
    if(!S.where)S.where='포장';S.pool=pool;S.cat=null;S.situ=null;S.less=LESS_RE.test(text);S.page=0;S.rerolls=0;S.stage='picks';show();return;
  }
  if(action.intent==='modify'){
    const record=action.items?.[0];if(!record||record.menu_id!==S.item?.id)return;
    S.cfg=record.cfg;show();return;
  }
  if(action.intent==='order'){
    const records=(action.items||[]).filter(r=>byId[r.menu_id]&&!byId[r.menu_id].sold_out);
    if(!records.length)return;
    if(!S.where)S.where='포장';
    if(records.length===1&&records[0].quantity===1){const r=records[0];choose(byId[r.menu_id],r.cfg);return;}
    for(const r of records){editIndex=null;addLine(byId[r.menu_id],r.cfg,r.quantity,true);}
    S.stage='cart';show();return;
  }
  if(action.intent==='navigate'){
    if(action.target==='back'){goBack();return;}
    if(action.target==='pay'&&!S.cart.length){action.reply='먼저 메뉴를 담아 주세요.';return;}
    if(['taste','full','cart','pay','fork','where'].includes(action.target)){S.stage=action.target;show();}
  }
}
